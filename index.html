<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | PunctuOwlity</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <header class="topbar"><button class="icon-button back" aria-label="Go back">←</button><div class="topbar-menu"><button class="menu-button" type="button" aria-label="Open page menu" aria-expanded="false"><span></span><span></span><span></span></button><nav class="menu-panel" aria-label="Project pages"><a href="case-study.html">Case Study</a><a href="articles.html">Articles</a></nav></div></header>
  <main class="auth-page">
    <div class="logo" role="img" aria-label="PunctuOwlity logo"></div>
    <h1>Welcome to PunctuOwlity!</h1>
    <form id="loginForm" class="form-card" novalidate>
      <label class="field"><span class="sr-only">Username or email</span><input id="editUsername" type="text" autocomplete="username" placeholder="Username or Email" required></label>
      <label class="field password-field"><span class="sr-only">Password</span><input id="editPassword" type="password" autocomplete="current-password" placeholder="Password" required><button type="button" class="toggle-password" aria-label="Show password">◉</button></label>
      <button class="button coral" type="submit">Login</button>
      <p>Don’t have an account?</p>
      <a class="button turquoise" href="signup.html">Sign Up</a>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
