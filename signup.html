<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create an Account | PunctuOwlity</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="signup">
  <header class="topbar">
    <button class="icon-button back" aria-label="Go back">←</button>
    <div class="topbar-menu"><button class="menu-button" type="button" aria-label="Open page menu" aria-expanded="false"><span></span><span></span><span></span></button><nav class="menu-panel" aria-label="Project pages"><a href="case-study.html">Case Study</a><a href="articles.html">Articles</a></nav></div>
  </header>
  <main class="auth-page signup-page">
    <div class="logo" role="img" aria-label="PunctuOwlity logo"></div>
    <h1>Create an Account</h1>
    <form id="signupForm" class="form-card">
      <label class="field"><span class="sr-only">First name</span><input id="firstName" autocomplete="given-name" placeholder="First Name" required></label>
      <label class="field"><span class="sr-only">Last name</span><input id="lastName" autocomplete="family-name" placeholder="Last Name" required></label>
      <label class="field"><span class="sr-only">Email address</span><input id="editEmail" type="email" autocomplete="email" placeholder="Email Address" required></label>
      <label class="field"><span class="sr-only">Phone number</span><input id="phone" type="tel" autocomplete="tel" placeholder="Phone (optional, for SMS alerts)"></label>
      <label class="field"><span class="sr-only">Username</span><input id="signupUsername" autocomplete="username" placeholder="Username" required></label>
      <label class="field password-field"><span class="sr-only">Password</span><input id="signupPassword" type="password" autocomplete="new-password" placeholder="Password" required><button type="button" class="toggle-password" aria-label="Show password">◉</button></label>
      <label class="field password-field"><span class="sr-only">Confirm password</span><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm Password" required><button type="button" class="toggle-password" aria-label="Show password">◉</button></label>
      <button class="button turquoise" type="submit">Sign Up</button>
      <p class="account-prompt">Already have an account?<br><a href="index.html">Login</a></p>
      <p id="signupError" class="error" role="alert"></p>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
