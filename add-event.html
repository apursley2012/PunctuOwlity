<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add/Edit An Event | PunctuOwlity</title><link rel="stylesheet" href="styles.css"></head><body data-page="add"><header class="topbar"><button class="icon-button back" aria-label="Go back">←</button></header><main class="event-form-page"><h1>Add/Edit An Event</h1><form id="eventForm"><label class="plain-field"><span class="sr-only">Event title</span><input id="eventTitle" placeholder="Enter event title" required></label><label class="plain-field"><span class="sr-only">Event date</span><input id="eventDate" type="date" required></label><label class="plain-field"><span class="sr-only">Event time</span><input id="eventTime" type="time"></label><label class="switch-row"><span>Would you like to be reminded of this event?</span><input id="eventAlert" type="checkbox" role="switch"></label><button class="button turquoise" type="submit">Save Event</button></form></main><script src="app.js"></script></body></html>
